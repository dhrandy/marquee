name: Tests
on:
  push:
    paths-ignore: ["README.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["README.md", "docs/**", "LICENSE"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CHROME_PATH: ""
